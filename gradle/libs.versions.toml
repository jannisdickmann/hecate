# Single source of truth for every dependency version.
# Versions are pinned deliberately (see SPECIFICATION.md §7 "Risks"): Health Services
# and Health Connect are alpha-versioned and churn, so upgrades must be explicit.
[versions]
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.12"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"

androidxCore = "1.19.0"
androidxActivityCompose = "1.13.0"
androidxLifecycle = "2.11.0"
androidxConcurrentFutures = "1.3.0"
# Not used directly by either module. play-services-basement drags in
# androidx.fragment 1.1.0, which is old enough that lint refuses the
# ActivityResult APIs; this constrains it up to the AndroidX generation the rest
# of these pins come from. See the `constraints` block in each module.
androidxFragment = "1.9.0"
composeBom = "2026.09.00"
wearCompose = "1.6.2"
wearOngoing = "1.1.0"
wearToolingPreview = "1.0.0"
healthServices = "1.1.0-rc02"
# Health Services declares Guava at *runtime* scope only, so ListenableFuture — the
# return type of every ExerciseClient.*Async method — is absent from the compile
# classpath. Consumed `compileOnly`: it is already in the APK transitively.
#
# Deliberately NOT the newest Guava. This must be exactly what health-services-client
# drags in at runtime, or the module compiles against a Guava the APK does not ship.
# Check it after any healthServices bump: ./gradlew :wear:dependencyInsight
#   --configuration debugRuntimeClasspath --dependency com.google.guava:guava
guava = "32.0.1-android"
# alpha12 is where the Metadata factories (activelyRecordedWithId etc.) arrive;
# alpha11 had only the raw constructor. 1.1.0 stable exists with the same API —
# see OPEN-POINTS.md §1.1 before taking it.
healthConnect = "1.1.0"
room = "2.8.5"
work = "2.11.2"
playServicesWearable = "20.0.1"

junit = "4.13.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "androidxConcurrentFutures" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# The ~40 icons of the core set, which is every icon this app needs. Deliberately
# NOT material-icons-extended: release builds run with isMinifyEnabled = false
# (§6.3), so an unused icon is an icon that ships.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# Wear Material 3. Same version as the rest of the Wear Compose group, so the
# catalog needs no new version line — see Appendix A on the move off Material
# 2.5, whose Chip was the last of the old visual language in this app.
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
wear-tooling-preview = { module = "androidx.wear:wear-tooling-preview", version.ref = "wearToolingPreview" }

health-services-client = { module = "androidx.health:health-services-client", version.ref = "healthServices" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
