org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Verified against a clean build of all three modules, KSP and Room's schema export
# included. It saves roughly a third of an up-to-date run (620ms -> 420ms here) by
# skipping configuration entirely. Note that it turns configuration-cache problems
# into build failures rather than warnings: a plugin or a build script that reaches
# for a Project at execution time now stops the build. See the `cleanAll` task in
# build.gradle.kts for what that looks like.
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
